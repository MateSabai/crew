<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABAI crew profiles</title>
<meta name="description" content="Answer a few questions about yourself for your SABAI crew profile.">
<meta name="theme-color" content="#FBF7EF">
<meta property="og:title" content="SABAI crew profiles">
<meta property="og:description" content="Answer a few questions about yourself for your crew profile.">
<meta property="og:image" content="https://matesabai.github.io/crew/og.jpg">
<meta property="og:url" content="https://matesabai.github.io/crew/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23142F43'/%3E%3Cpath d='M4 19h24l-3.4 4.6H5z' fill='%23fff'/%3E%3Cpath d='M9 19l2.6-4.4h9.4L24 19z' fill='%23BA9456'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#142F43; --navy-2:#1F3A52; --gold:#BA9456; --gold-soft:#EADBC0; --cream:#FBF7EF; --sand:#E9E4D9;
  --paper:#FFFFFF; --ink:#1B2833; --muted:#5E6B75; --line:#E4DACA; --ok:#2F6B4F; --warn:#9A5B13; --bad:#A3392F;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink)}
body{font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer}
a{color:var(--navy)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.logo{display:inline-block;color:var(--navy);line-height:0}
.logo svg{height:100%;width:auto}

/* hero */
.hero{background:linear-gradient(180deg,var(--sand) 0%,var(--cream) 100%);border-bottom:1px solid var(--line);overflow:hidden}
.hero .wrap{padding-top:28px;text-align:center}
.hero .logo{height:30px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:18px 0 10px}
.hero h1{font:600 38px/1.1 var(--serif);color:var(--navy);margin:0 0 14px;letter-spacing:-.01em}
.hero .lede{font-size:17px;color:var(--ink);max-width:520px;margin:0 auto 18px}
.chars{display:flex;justify-content:center;align-items:flex-end;margin:8px auto 0;max-width:600px;padding:0 4px}
.chars img{width:18.5%;height:auto;margin:0 -1%;filter:drop-shadow(0 6px 10px rgba(20,47,67,.15))}
.chars.small{max-width:360px;margin-top:18px}

.facts{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:10px}
.facts li{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.facts .dot{flex:0 0 26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font:600 13px/26px var(--sans);text-align:center}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:rgba(251,247,239,.94);backdrop-filter:saturate(1.2) blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:56px}
.bar .logo{height:16px;flex:0 0 auto}
.track{flex:1;height:6px;background:var(--sand);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#CFAE74);border-radius:6px;transition:width .35s ease}
.count{flex:0 0 auto;font:600 13px/1 var(--sans);color:var(--navy);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:7px 10px;white-space:nowrap}
.count.done{background:var(--navy);color:#fff;border-color:var(--navy)}

/* section */
.banner{margin:20px 0 0;border-radius:var(--radius);overflow:hidden;aspect-ratio:3/1;background:var(--sand);box-shadow:0 10px 30px -18px rgba(20,47,67,.6)}
.banner img{width:100%;height:100%;object-fit:cover}
.sec-head{margin:22px 0 8px}
.sec-head .eyebrow{margin:0 0 8px}
.sec-head h1{font:600 30px/1.15 var(--serif);color:var(--navy);margin:0 0 6px}
.sec-head p{margin:0;color:var(--muted)}

/* questions */
.q{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px 16px;margin:14px 0;transition:border-color .2s, box-shadow .2s}
.q:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(186,148,86,.15)}
.q.answered{border-left:4px solid var(--gold);padding-left:13px}
.q .num{font:600 11px/1 var(--sans);letter-spacing:.14em;color:var(--gold);margin-bottom:8px;text-transform:uppercase}
.q label.qt{display:block;font:400 20px/1.3 var(--serif);color:var(--navy);margin:0 0 4px}
.q .hint{font-size:14px;color:var(--muted);margin:0 0 10px}
.q .req{color:var(--gold)}
.q input[type=text],.q input[type=email],.q textarea{width:100%;border:1px solid var(--line);background:#FDFBF7;border-radius:10px;padding:12px 13px;font:16px/1.45 var(--sans);color:var(--ink);outline:none;margin-top:6px}
.q textarea{min-height:84px;resize:vertical}
.q input:focus,.q textarea:focus{border-color:var(--gold);background:#fff}
.q.private{background:#F7F3EA;border-style:dashed}
.lock{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--warn);margin-bottom:8px}

.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{border:1px solid var(--line);background:#FDFBF7;color:var(--navy);border-radius:999px;padding:10px 16px;font:500 15px/1 var(--sans);min-height:42px;transition:all .15s}
.pill[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:8px}
.pair .pill{border-radius:12px;min-height:52px;font-size:16px}

.consent{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.consent input{width:22px;height:22px;margin:3px 0 0;accent-color:var(--navy);flex:0 0 auto}
.consent span{font-size:15px}

/* nav */
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:26px 0 40px}
.btn{border:0;border-radius:12px;padding:15px 22px;font:600 16px/1 var(--sans);min-height:52px}
.btn.primary{background:var(--navy);color:#fff;flex:1}
.btn.primary:hover{background:var(--navy-2)}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#fff;flex:1}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stepnote{font-size:14px;color:var(--muted);text-align:center;margin:-26px 0 34px}
.err{color:var(--bad);font-size:14px;margin-top:8px}

/* review list */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;margin:14px 0}
.card h2{font:600 20px/1.25 var(--serif);color:var(--navy);margin:0 0 10px}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.checks li:first-child{border-top:0}
.checks .ok{color:var(--ok);font-weight:600}
.checks .no{color:var(--warn);font-weight:600}
.checks button{background:none;border:0;color:var(--navy);text-decoration:underline;padding:0;font-size:15px;text-align:left}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}

/* thanks + other pages */
.centre{text-align:center}
.page-head{padding-top:26px;padding-bottom:6px;text-align:center}
.page-head .logo{height:22px}
.page-head h1{font:600 30px/1.15 var(--serif);color:var(--navy);margin:14px 0 6px}
.page-head p{color:var(--muted);margin:0}
.status{display:inline-block;font:600 12px/1 var(--sans);letter-spacing:.06em;padding:7px 10px;border-radius:999px;background:var(--sand);color:var(--navy);margin-top:10px}
.status.approved{background:#E1EFE6;color:var(--ok)}
.status.change{background:#F7E9D6;color:var(--warn)}
.profile{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px;margin:18px 0;box-shadow:0 14px 34px -26px rgba(20,47,67,.7)}
.profile .who{font:600 24px/1.2 var(--serif);color:var(--navy);margin:0}
.profile .post{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:8px 0 14px}
.profile .text{font:400 17px/1.6 var(--serif);white-space:pre-wrap;color:var(--ink)}
.note{background:#F7F3EA;border-left:3px solid var(--gold);border-radius:8px;padding:12px 14px;margin:14px 0;font-size:15px}
pre.prompt{white-space:pre-wrap;word-wrap:break-word;background:#F6F2EA;border:1px solid var(--line);border-radius:10px;padding:14px;font:12.5px/1.5 Menlo,Consolas,monospace;max-height:420px;overflow:auto}
details summary{cursor:pointer;color:var(--navy);font-weight:600;padding:6px 0}
.ans{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.ans .k{color:var(--muted);font-size:13px;margin-bottom:2px}
.steps-n{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#fff;text-align:center;font:600 13px/26px var(--sans);margin-right:8px}
textarea.big{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:13px;font:16px/1.55 var(--serif);background:#FDFBF7;outline:none}
textarea.big:focus{border-color:var(--gold);background:#fff}
textarea.mid{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:12px;font:15px/1.5 var(--sans);background:#FDFBF7;outline:none;margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.small{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:20}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:700px){
  .hero h1{font-size:46px}
  .sec-head h1{font-size:34px}
  .q{padding:22px 22px 20px}
  .q.answered{padding-left:19px}
}
/* ---------- shared motion ---------- */
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.26s}.d4{animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-16px) rotate(-3deg)}55%{transform:translateY(0)}72%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,color .25s,border-color .25s,transform .12s,box-shadow .25s}
.btn:active{transform:scale(.97)}
.linkbtn{background:none;border:0;color:var(--navy);text-decoration:underline;text-underline-offset:3px;font:500 14.5px/1.3 var(--sans);padding:8px 0;margin-top:6px;display:inline-flex;align-items:center;gap:6px}
.linkbtn.inline{padding:0;margin:0;font-size:inherit}
.plain{margin:0;font-size:15px;color:var(--ink)}

/* hero: crew stand in the water, waves drift past */
.hero{background:linear-gradient(180deg,var(--cream) 0%,var(--sand) 100%);border-bottom:0;position:relative}
.waves{position:relative;z-index:2;height:44px;margin-top:-30px;overflow:hidden;pointer-events:none}
.waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%}
.waves .w1{animation:drift 16s linear infinite}
.waves .w2{animation:drift 11s linear infinite reverse}
.chars{position:relative;z-index:1}
.chars>img{width:18.5%;height:auto;margin:0 -1%;filter:drop-shadow(0 6px 10px rgba(20,47,67,.15))}
.chars .c{position:relative;width:18.5%;margin:0 -1%;padding:0;border:0;background:none;animation:charIn .8s cubic-bezier(.2,1.25,.4,1) both;-webkit-tap-highlight-color:transparent}
.chars .c img{width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(20,47,67,.15))}
.chars .c.say{z-index:3}
.hopw,.bobw{display:block}
.bobw{animation:idle 4s ease-in-out infinite}
.hopw.go{animation:hop .75s cubic-bezier(.3,.7,.4,1)}
@keyframes charIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.chars.jump .c{animation-name:jumpIn;animation-duration:1s}
@keyframes jumpIn{0%{opacity:0;transform:translateY(80px)}50%{opacity:1;transform:translateY(-22px)}75%{transform:translateY(4px)}100%{transform:none}}
.c .bub{position:absolute;left:50%;top:-4px;transform:translate(-50%,8px);background:var(--navy);color:#fff;font:600 11.5px/1 var(--sans);padding:7px 9px;border-radius:9px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;z-index:3}
.c .bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--navy);border-bottom:0}
.c.say .bub{opacity:1;transform:translate(-50%,-10px)}
.facts .dot{flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center}
.btn.shine{position:relative;overflow:hidden}
.btn.shine::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:shine 3.8s ease-in-out 1.4s infinite}
@keyframes shine{0%{left:-60%}35%,100%{left:130%}}
.pillc{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 9px;font-size:12.5px;font-weight:600}
.tapnote{margin:-26px 0 40px}

/* loading */
.loading{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--navy)}
.loading .logo{height:22px}
.loading .lb{width:64px;margin-top:22px;animation:bob 2.2s ease-in-out infinite}
.loading .lb svg{display:block;width:100%;height:auto}
.loading .lw{width:140px;height:10px;overflow:hidden;position:relative;margin-top:-6px}
.loading .lw svg{position:absolute;left:0;top:0;width:200%;height:100%;animation:drift 2.4s linear infinite}
.loading p{margin:6px 0 0;color:var(--muted);font-size:15px}

/* voyage bar */
#ftop{position:sticky;top:0;z-index:6}
.vbar{background:rgba(251,247,239,.95);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.vbar .wrap{display:flex;align-items:center;gap:12px;height:58px;max-width:1000px}
.logobtn{flex:0 0 auto;background:none;border:0;padding:4px 0;color:var(--navy);line-height:0}
.logobtn .logo{height:15px}
.iconbtn{flex:0 0 auto;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--paper);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;padding:0;transition:border-color .2s,transform .12s}
.iconbtn:hover{border-color:var(--gold)}
.iconbtn:active{transform:scale(.94)}
.voyage{position:relative;flex:1;height:32px;min-width:100px;margin:0 8px}
.voyage .route{position:absolute;left:0;right:0;top:21px;border-top:2px dashed #D6CCBA}
.voyage .wake{position:absolute;left:0;top:20px;height:4px;width:0;border-radius:4px;background:linear-gradient(90deg,rgba(186,148,86,.15),var(--gold));transition:width .8s cubic-bezier(.3,.7,.3,1)}
.voyage .wp{position:absolute;top:15px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--cream);border:2px solid #D6CCBA;padding:0;transition:background .3s,border-color .3s,transform .2s,left .5s}
.voyage .wp::after{content:"";position:absolute;inset:-8px}
.voyage .wp.passed{background:var(--gold);border-color:var(--gold)}
.voyage .wp:hover{transform:scale(1.3)}
.voyage .port{position:absolute;right:-9px;top:15px;color:var(--navy);line-height:0;background:var(--cream)}
.voyage .boat{position:absolute;top:0;left:0;width:30px;margin-left:-15px;line-height:0;transition:left .8s cubic-bezier(.3,.7,.3,1);z-index:2}
.voyage .boat svg{display:block;width:30px;height:16px;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 80%}
.chip{flex:0 0 auto;font:600 13px/1 var(--sans);color:var(--navy);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:8px 11px;white-space:nowrap}
.chip.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@media (max-width:380px){.logobtn{display:none}}
@media (max-width:480px){.voyage .wp{width:11px;height:11px;margin-left:-5.5px;top:16.5px;border-width:1.5px}.vbar .wrap{gap:9px}}

/* stage: the host crew member peeks over the card on phones, stands beside it on wide screens */
.stage{position:relative;max-width:760px;margin:0 auto;padding:80px 16px 48px}
.host{position:absolute;right:26px;top:8px;height:72px;margin:0;overflow:hidden;z-index:1;pointer-events:none}
.host img{height:180px;width:auto;max-width:none;margin-top:16px}
.host.in img{animation:hostIn .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes hostIn{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
.hopw.go{animation:hop .75s cubic-bezier(.3,.7,.4,1)}
#fslot{position:relative;z-index:2}
#fslot.leave-fwd{animation:leaveF .16s ease-in forwards}
#fslot.leave-back{animation:leaveB .16s ease-in forwards}
#fslot.enter-fwd{animation:enterF .45s cubic-bezier(.2,.8,.2,1) both}
#fslot.enter-back{animation:enterB .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes leaveF{to{opacity:0;transform:translateX(-36px)}}
@keyframes leaveB{to{opacity:0;transform:translateX(36px)}}
@keyframes enterF{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes enterB{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
@media (min-width:900px){
  .stage{max-width:1000px;display:flex;align-items:flex-start;justify-content:center;gap:10px;padding-top:44px}
  .host{position:sticky;top:96px;right:auto;height:auto;overflow:visible;flex:0 0 250px;display:flex;justify-content:center}
  .host img{height:400px;margin-top:0}
  #fslot{flex:0 1 640px;min-width:0}
}

/* cards */
.card2{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px 18px 20px;box-shadow:0 26px 50px -34px rgba(20,47,67,.55)}
.card2+.card2{margin-top:14px}
.card2 h2{font:600 20px/1.25 var(--serif);color:var(--navy);margin:0 0 10px}
.card2.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.card2.private{background:#F7F3EA;border-style:dashed}
.qmeta{display:flex;justify-content:space-between;gap:10px;font:600 11.5px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.qmeta span:last-child{color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.qtext{font:400 26px/1.22 var(--serif);color:var(--navy);margin:0 0 8px;letter-spacing:-.01em}
.qhint{color:var(--muted);font-size:15px;margin:0}
.req{color:var(--gold)}
.field{margin-top:16px}
.ans-input,.ans-area{width:100%;border:1.5px solid var(--line);background:#FDFBF7;border-radius:14px;padding:14px 15px;font:17px/1.5 var(--sans);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.ans-area{min-height:140px;resize:none;overflow:hidden}
.ans-input:focus,.ans-area:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(186,148,86,.16)}
.ans-input::placeholder,.ans-area::placeholder{color:#A8A196}
.idea{background:none;border:0;padding:6px 0 0;margin:6px 0 0;color:var(--gold);font:600 14px/1.2 var(--sans);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.idea:hover{color:#9C7A42}
.ideabox{margin:10px 0 2px;background:#FBF5EA;border:1px dashed #D9C39C;border-radius:14px;padding:12px 14px 8px}
.ideabox[hidden]{display:none}
.ideabox .lbl{display:block;font:600 10.5px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.ideabox p{margin:0 0 4px;font:italic 400 16.5px/1.45 var(--serif);color:var(--navy)}
.ideabox .linkbtn{margin:0;padding:6px 0;font-size:13.5px}
.ideabox.pop2 p{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.voice{display:flex;align-items:center;gap:7px;margin:8px 2px 0;font-size:13px;color:var(--muted)}
.voice svg{color:var(--gold);flex:0 0 auto}
.seg{display:flex;background:var(--sand);border-radius:12px;padding:3px;margin:4px 0 8px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font:600 14px/1 var(--sans);color:var(--navy)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(20,47,67,.15)}
.rpart{font:600 11px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:16px 2px 6px}
.qrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font:400 15.5px/1.35 var(--serif);color:var(--navy)}
.qrow:hover{border-color:var(--gold)}
.qrow .qt2{flex:0 0 20px;height:20px;border-radius:50%;border:1.5px solid #D6CCBA;display:flex;align-items:center;justify-content:center;margin-top:1px;color:#fff}
.qrow.done .qt2{background:var(--ok);border-color:var(--ok)}
.qrow.done{color:var(--muted)}
.readall summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;color:var(--navy)}
.readall summary::-webkit-details-marker{display:none}
.readall summary b{display:block;font:600 20px/1.25 var(--serif)}
.readall summary small{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.readall summary svg{transition:transform .2s;color:var(--gold);flex:0 0 auto}
.readall[open] summary svg{transform:rotate(90deg)}
.rlist{margin-top:6px}
.rrow{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;cursor:pointer;color:var(--ink)}
.rrow:hover{background:#FDFBF7}
.rrow .rq{display:block;font-size:13px;color:var(--muted);margin:0 0 3px}
.rrow .rq em{font-style:normal;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);font-weight:600;margin-left:4px}
.rrow .ra{display:block;font:400 16px/1.5 var(--serif);color:var(--ink)}
.rrow .re{display:block;font:600 12.5px/1 var(--sans);color:var(--gold);margin-top:6px}
.meter{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:20px}
.meter .m{flex:0 0 84px;height:5px;border-radius:5px;background:var(--sand);overflow:hidden}
.meter .m i{display:block;height:100%;width:0;background:linear-gradient(90deg,#D9BE8A,var(--gold));border-radius:5px;transition:width .35s}
.meter span{font-size:13px;color:var(--muted)}
.meter.l0 .m{opacity:.6}
.meter.l3 #mtext,.meter.l4 #mtext,.meter.top #mtext{color:var(--ok);font-weight:600}
.need{color:var(--bad);font-size:14px;margin-top:8px}
.need:empty{display:none}
.qnav{display:flex;gap:10px;align-items:center;margin-top:20px}
.btn.back{flex:0 0 54px;width:54px;padding:0}
.btn.next{flex:1}
.btn.primary.skip{background:var(--paper);color:var(--navy);border:1px solid var(--line)}
.btn.primary.skip:hover{border-color:var(--gold);background:var(--paper)}
.keys{text-align:right;font-size:12.5px;color:var(--muted);margin:10px 2px 0}
.keys kbd{font:600 11.5px/1 var(--sans);background:var(--sand);border-radius:5px;padding:3px 6px;color:var(--navy)}
@media (min-width:700px){
  .card2{padding:30px 30px 26px}
  .qtext{font-size:31px}
}

/* post tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tile{position:relative;border:1.5px solid var(--line);background:#FDFBF7;border-radius:16px;padding:12px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--navy);font:600 13.5px/1.2 var(--sans);text-align:center;transition:transform .15s,border-color .2s,background .2s,color .2s,box-shadow .2s}
.tile .face{width:62px;height:62px;border-radius:50%;background:var(--sand);overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile .face img{width:100%;height:100%;object-fit:cover}
.tile .face b{font:400 30px/1 var(--serif);color:var(--gold)}
.tile:hover{transform:translateY(-2px);border-color:var(--gold)}
.tile[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 14px 26px -16px rgba(20,47,67,.9);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.tile .tick{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#fff;display:none;align-items:center;justify-content:center}
.tile[aria-pressed=true] .tick{display:flex}

/* quick picks: this or that */
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:10px;margin-top:18px}
.duel .or{align-self:center;font:italic 400 18px/1 var(--serif);color:var(--gold)}
.pick{border:1.5px solid var(--line);background:#FDFBF7;border-radius:20px;padding:22px 8px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--navy);font:600 16px/1.2 var(--sans);min-height:156px;transition:transform .25s,opacity .25s,background .2s,border-color .2s,color .2s}
.pick .emo{font-size:48px;line-height:1;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.pick:hover{border-color:var(--gold)}
.pick:hover .emo{transform:scale(1.12) rotate(-6deg)}
.pick[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.pick[aria-pressed=true] .emo{transform:scale(1.15)}
.duel.chosen .pick[aria-pressed=false]{opacity:.42;transform:scale(.94)}

/* agreement */
.agree{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:#FDFBF7;border-radius:16px;padding:16px;color:var(--ink);font:15.5px/1.5 var(--sans);margin-top:16px;transition:border-color .2s,background .2s}
.agree .box{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
.agree .box path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .05s}
.agree[aria-pressed=true]{border-color:var(--ok);background:#F1F7F3}
.agree[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok)}
.agree[aria-pressed=true] .box path{stroke-dashoffset:0}

/* part title page */
.chap{padding:10px}
.chap .art{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:5/2;background:var(--sand)}
.chap .art .kb{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.16) translate(1.5%,1%)}to{transform:scale(1) translate(0,0)}}
.chap .art.plain{background:radial-gradient(circle at 30% 20%,#2F5878,var(--navy) 70%);display:flex;align-items:center;justify-content:center}
.chap .faces{display:flex;gap:2.5%;width:90%;justify-content:center}
.chap .faces img{width:14%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.85);background:var(--sand);animation:faceIn .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes faceIn{from{opacity:0;transform:translateY(26px) scale(.7)}to{opacity:1;transform:none}}
.chap .pnum{position:absolute;left:12px;top:12px;background:rgba(20,47,67,.84);color:#fff;font:600 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:8px 11px;border-radius:999px}
.chap .body{padding:18px 8px 6px}
.chap h1{font:600 34px/1.1 var(--serif);color:var(--navy);margin:0 0 8px}
.chap .body>p{color:var(--muted);margin:0;font-size:16.5px}
.chap .meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px}
.tag{display:inline-flex;align-items:center;gap:5px;font:600 12.5px/1 var(--sans);color:var(--navy);background:var(--sand);border-radius:999px;padding:8px 11px}
.tag.ok{background:#E1EFE6;color:var(--ok)}

/* parts sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,47,67,.38);z-index:30;animation:fadeIn .2s both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--cream);border-radius:22px 22px 0 0;max-height:84vh;overflow:auto;padding:8px 16px 24px;box-shadow:0 -20px 40px -20px rgba(0,0,0,.3);animation:sheetUp .34s cubic-bezier(.2,.9,.2,1) both}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:#D6CCBA;margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 6px}
.sheet-head h2{font:600 22px/1.2 var(--serif);color:var(--navy);margin:0}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;color:var(--ink);transition:border-color .2s,transform .15s}
.prow:hover{border-color:var(--gold);transform:translateX(3px)}
.prow.here{border-color:var(--gold);box-shadow:0 0 0 3px rgba(186,148,86,.15)}
.prow>img,.prow .ph{flex:0 0 46px;width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--sand);display:flex;align-items:center;justify-content:center;color:var(--navy)}
.prow .pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.prow .t{font-weight:600;color:var(--navy);font-size:15px}
.prow .n{font-size:13px;color:var(--muted)}
.mini{display:block;height:5px;border-radius:5px;background:var(--sand);overflow:hidden}
.mini i{display:block;height:100%;background:var(--gold);border-radius:5px}
.prow.send{background:var(--navy);border-color:var(--navy);color:#fff}
.prow.send .t{color:#fff}
.prow.send .ph{background:rgba(255,255,255,.12);color:#fff}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px;bottom:auto;top:10vh;border-radius:22px;animation:rise .3s cubic-bezier(.2,.8,.2,1) both}}

/* check and send */
.sum{text-align:center}
.sum .eyebrow{margin:0 0 8px}
.sum h1{font:600 32px/1.1 var(--serif);color:var(--navy);margin:0 0 6px}
.ring{position:relative;width:150px;height:150px;margin:12px auto 6px}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--sand)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.3,.7,.3,1)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font:600 46px/1 var(--serif);color:var(--navy)}
.ring .num span{font-size:12.5px;color:var(--muted);margin-top:4px}
.summsg{margin:6px auto 0;max-width:420px}
.sq{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:#FDFBF7;border:1px dashed var(--gold);border-radius:14px;padding:13px 14px;margin:8px 0 0;font:400 17px/1.3 var(--serif);color:var(--navy);transition:transform .15s,background .2s}
.sq:hover{background:#fff;transform:translateX(3px)}
.sq svg{flex:0 0 auto;color:var(--gold)}
#sugg .sq{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
#sugg .sq:nth-child(2){animation-delay:.06s}
#sugg .sq:nth-child(3){animation-delay:.12s}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.h2row h2{margin:0}
.h2row .linkbtn{margin:0}
.spin2 svg{animation:spin .5s ease-out}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ptile{display:flex;flex-direction:column;gap:7px;text-align:left;background:#FDFBF7;border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--navy);font-size:13.5px;transition:border-color .2s,transform .15s}
.ptile:hover{border-color:var(--gold);transform:translateY(-2px)}
.ptile .t{font-weight:600;font-size:14.5px}
.ptile .no{color:var(--warn);font-weight:600}
.ptile.warn{border-color:#E8C9A0;background:#FFF9F0}
.okc{color:var(--ok);line-height:0}
.warnbox{border-color:#E8C9A0;background:#FFF9F0}
.note2{background:#F7F3EA;border-left:3px solid var(--gold);font-size:15px}
.sendrow{margin-top:18px}
.btn.gold.ready{animation:glow 2.4s ease-out infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(186,148,86,.55)}100%{box-shadow:0 0 0 14px rgba(186,148,86,0)}}

/* celebrations */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall 2s cubic-bezier(.25,.6,.45,1) both}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0)}100%{transform:translate(var(--dx),106vh) rotate(var(--r))}}
.banner2{position:fixed;left:50%;top:72px;transform:translate(-50%,0);z-index:65;background:var(--navy);color:#fff;font:600 15px/1.35 var(--sans);padding:12px 18px;border-radius:14px;box-shadow:0 18px 40px -16px rgba(20,47,67,.7);width:max-content;max-width:calc(100% - 32px);text-align:center;border:1px solid rgba(186,148,86,.6);animation:dropIn .45s cubic-bezier(.2,1.3,.4,1) both}
.banner2.out{animation:dropOut .35s ease-in forwards}
@keyframes dropIn{from{opacity:0;transform:translate(-50%,-24px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes dropOut{to{opacity:0;transform:translate(-50%,-16px)}}

/* sending */
.sendov{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#24435E 0%,var(--navy) 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:fadeIn .3s both;overflow:hidden}
.sendov p{font:400 24px/1.2 var(--serif);margin:0;animation:breathe 1.6s ease-in-out infinite}
.sendov .sboat{width:120px;animation:sail 2.8s ease-in-out infinite}
.sendov .sboat svg{display:block;width:100%;height:auto}
.sendov .waves{position:absolute;left:0;right:0;bottom:0;height:22vh;margin:0}
@keyframes sail{0%,100%{transform:translate(-18px,0) rotate(-3deg)}50%{transform:translate(18px,-6px) rotate(3deg)}}
@keyframes breathe{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

 read it every summer."], "Q44": ["My nephew asking if fish get thirsty.", "A seagull taking a whole croissant out of a man's hand in Portofino."], "Q45": ["Rain on the hatch when I'm already in my bunk.", "The anchor chain running out in a quiet bay."], "Q48": ["A waterproof pouch for my phone. It has saved it three times.", "Good earplugs. The best sleep I've had in years."], "Q21": ["The passerelle. I connect people, and I go up and down a lot.", "A fender. Gets squashed, bounces back, always where it's needed."], "Q22": ["The bow at sunrise, with a cup of tea, before the deck is washed down.", "The sun deck at night, at anchor, when the stars are out."], "Q23": ["Anchored off Porquerolles in May. Clear water, nobody else there, and the smell of pine coming off the island.", "Swimming ashore at Cala Macarella in Menorca for an ice cream, then swimming back."], "Q24": ["An octopus. Curious, good at squeezing into small spaces and slightly chaotic.", "A dolphin. Happiest in a group, and I talk a lot."], "Q25": ["A pod of pilot whales alongside us at dawn off Sardinia, for twenty minutes.", "The sea lit up green at night off Corsica, every wave glowing."], "Q26": ["That we're up before them and in bed after them, and we still like it.", "How long it takes to fold a towel into a swan."], "Q27": ["Tokyo. I'd eat my way round the fish market, then sleep on the bullet train.", "Lisbon. Pastries for breakfast, the number 28 tram, sunset at a miradouro."], "Q46": ["My grandad's old watch. It doesn't work, but it goes everywhere with me.", "The notebook where I write down every place we anchor."], "Q47": ["A lifeguard in Cornwall.", "Something with animals. Probably looking after the penguins at a zoo."], "Q37": ["That I'm shy. I'm just listening first.", "People think I'm serious because I'm quiet on watch. Off watch I'm the one starting the card games."], "Q38": ["Olives. I hated them for twenty years. Now I eat them by the jar.", "Early mornings. I used to think they we       if (!parts) return '';
      var count = all.filter(function (q) { return shown(q) && q.type !== 'consent' && has(q); }).length;
      return '<div class="card2"><details class="readall"><summary><span><b>Read through your answers</b><small>' + count + ' answers. Tap one to change it.</small></span>' + ic('right') + '</summary>' +
        '<div class="rlist">' + parts + '</div></details></div>';
    }

    function thanks(r) {
      shellOn = false;
      var known = val('knownas') || String(val('name') || '').split(/\s+/)[0];
      paint('<section class="hero"><div class="wrap">' + logo() + '<p class="eyebrow rise d1">Sent</p><h1 class="rise d2">Thank you' + (known ? ', ' + esc(known) : '') + '</h1>' +
        '<p class="lede rise d3">Your answers are with the Purser. You will get an email with your profile to approve before anything is printed.</p>' + crewRow('jump') + '</div>' +
        waves('#FBF7EF', 'rgba(186,148,86,.24)') + '</section>' +
        '<main class="wrap centre"><p class="small" style="margin:22px 0 40px">' + (r && r.ref ? 'Reference ' + esc(r.ref) + '. ' : '') + 'You can close this page.</p></main>');
      bindCrew();
      setTimeout(function () { confetti(150); }, 300);
    }

    function intro() {
      shellOn = false; hostSrc = null;
      var n = counted(), any = Object.keys(st.answers).some(function (k) { return val(k); });
      var facts = [['clock', 'Allow 30 to 45 minutes. The more detail you give, the better your profile.'],
        ['pen', 'Answer as many of the ' + countable.length + ' questions as you can, in as much detail as you can. You need at least ' + MIN + '.'],
        ['phone', 'Your answers are kept on this phone as you go, so you can stop and come back.'],
        ['shield', 'Nothing is printed until you and the Captain have approved the text.']];
      paint('<section class="hero"><div class="wrap">' + logo() +
        '<p class="eyebrow rise d1">Crew profiles</p><h1 class="rise d2">Your crew profile</h1>' +
        '<p class="lede rise d3">Your answers are used to write a short profile of you for the Welcome Book that guests read on board, and for the charter brochure.</p>' +
        crewRow() + '</div>' + waves('#FBF7EF', 'rgba(186,148,86,.24)') + '</section>' +
        '<main class="wrap"><ul class="facts">' + facts.map(function (f, k) {
          return '<li class="rise" style="animation-delay:' + (450 + k * 90) + 'ms"><span class="dot">' + ic(f[0], 16, 2) + '</span><span>' + esc(f[1]) + '</span></li>';
        }).join('') + '</ul>' +
        '<div class="nav rise" style="animation-delay:820ms">' + (any ? '<button type="button" class="btn ghost" id="fresh">Start again</button>' : '') +
        '<button type="button" class="btn primary shine" id="go">' + (any ? 'Carry on' + (n ? ' <span class="pillc">' + n + ' answered</span>' : '') : 'Start') + ic('right') + '</button></div>' +
        '<p class="small centre tapnote">Tap the crew to say hello. <button type="button" class="linkbtn inline" id="seeAll">See all the questions first</button></p></main>');
      bindCrew();
      document.getElementById('go').onclick = function () { show(st.at || { s: 0, q: -1 }, 'fwd'); };
      document.getElementById('seeAll').onclick = function () { partsSheet('all'); };
      var f = document.getElementById('fresh');
      if (f) f.onclick = function () {
        if (confirm('Clear your answers on this phone and start again?')) { st = { answers: {}, ms: [], at: null }; dropDraft(); lastCount = 0; intro(); }
      };
    }

    if (st.at) show(st.at, 'fwd'); else intro();
  }

  // ------------------------------------------------------------ the Purser's page
  function Send() {
    var b = BOOT;
    var statusCls = b.status === 'Approved' ? ' approved' : (/Change/.test(b.status) ? ' change' : '');
    var history = '';
    if (b.round > 0) {
      history = '<div class="card"><h2>Where it is</h2><p style="margin:0 0 8px">Status: <b>' + esc(b.status) + '</b>. Version ' + b.round + ' was the last one sent.</p>' +
        (b.crewComment ? '<div class="note"><b>' + esc(b.knownAs) + ' asked:</b><br>' + esc(b.crewComment).replace(/\n/g, '<br>') + '</div>' : '') +
        (b.captainComment ? '<div class="note"><b>The Captain asked:</b><br>' + esc(b.captainComment).replace(/\n/g, '<br>') + '</div>' : '') +
        (b.status === 'With crew member' || b.status === 'With the Captain' ? '<p class="small" style="margin:6px 0 0">Sending a new version replaces the one waiting for approval.</p>' : '') + '</div>';
    }
    var answers = b.answers.map(function (x) { return '<div class="ans"><div class="k">' + esc(x.q) + '</div>' + esc(x.a).replace(/\n/g, '<br>') + '</div>'; }).join('');
    paint('<header class="page-head wrap">' + logo() + '<h1>Crew profile for ' + esc(b.name) + '</h1><p>' + esc(b.post) + ' \u00b7 answers sent ' + esc(b.submitted) + ' \u00b7 ' + esc(b.ref) + '</p>' +
      '<span class="status' + statusCls + '">' + esc(b.status) + '</span></header>' +
      '<main class="wrap">' + history +
      '<div class="card"><h2><span class="steps-n">1</span>Write it</h2><p style="margin:0 0 12px">' + (b.writer ? 'Press the button: it copies ' + esc(b.knownAs) + '\'s answers and opens the SABAI Profile Writer. Paste them there and press Write the profiles.' : 'Copy ' + esc(b.knownAs) + '\'s answers and paste them into the SABAI Profile Writer.') + '</p>' +
      '<div class="row">' + (b.writer ? '<a class="btn primary" id="copyGo" href="' + esc(b.writer) + '" target="_blank" rel="noopener" style="text-decoration:none;flex:1 1 auto">Copy and open the Profile Writer</a>' : '') +
      '<button class="btn ghost" id="copy" style="flex:0 1 auto">' + (b.writer ? 'Copy only' : 'Copy') + '</button></div>' +
      '<details style="margin-top:12px"><summary>Show what is copied</summary><pre class="prompt" id="prompt">' + esc(b.prompt) + '</pre></details></div>' +
      '<div class="card"><h2><span class="steps-n">2</span>Send it for approval</h2><p style="margin:0 0 10px">Paste the final text below. It goes to ' + esc(b.knownAs) + ' (' + esc(b.email) + ') to approve, then to the Captain. You get an email when it is approved or if either asks for a change.</p>' +
      '<textarea class="big" id="text" placeholder="Paste the profile text here">' + esc(b.text) + '</textarea>' +
      '<label class="small" for="note" style="display:block;margin-top:12px">Note to ' + esc(b.knownAs) + ' (optional)</label><textarea class="mid" id="note">' + esc(b.note) + '</textarea>' +
      '<div class="err" id="err" role="alert"></div>' +
      '<div class="nav" style="margin:16px 0 4px"><button class="btn gold" id="send">Send to ' + esc(b.knownAs) + ' to approve</button></div></div>' +
      '<div class="card"><details><summary>' + esc(b.knownAs) + '\'s answers (' + b.answers.length + ')</summary>' + answers + '</details></div>' +
      '<p class="small centre" style="margin:20px 0 40px">Keep this link to yourself: it opens the page for this profile.</p></main>');
    // copy straight away inside the tap, so it still works when the link opens a new tab
    var copyNow = function () {
      var ta = document.createElement('textarea'); ta.value = b.prompt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      if (!ok && navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(b.prompt); ok = true; }
      return ok;
    };
    var cannot = function () { document.querySelector('details').open = true; toast('Select the text below and copy it'); };
    document.getElementById('copy').onclick = function () { if (copyNow()) toast('Copied. Paste it into the Profile Writer.'); else cannot(); };
    var cg = document.getElementById('copyGo');
    if (cg) cg.onclick = function (e) { if (copyNow()) toast('Copied. Paste it into the Profile Writer.'); else { e.preventDefault(); cannot(); } };
    var send = document.getElementById('send');
    send.onclick = function () {
      var text = document.getElementById('text').value.trim(), note = document.getElementById('note').value.trim();
      if (text.length < 20) { document.getElementById('err').textContent = 'Paste the profile text first.'; return; }
      if (!confirm('Send this text to ' + b.knownAs + ' to approve?')) return;
      send.disabled = true; send.innerHTML = '<span class="spin"></span>Sending';
      call('sendForApproval', [b.ref, b.k, text, note], function () {
        paint('<header class="page-head wrap">' + logo() + '<h1>Sent to ' + esc(b.knownAs) + '</h1><p>' + esc(b.knownAs) + ' has an email to approve the profile. Then it goes to the Captain. You will hear back by email.</p></header>' +
          '<main class="wrap">' + chars('small') + '<div class="nav"><button class="btn ghost" id="again" style="flex:1">Back to this profile</button></div></main>');
        document.getElementById('again').onclick = function () { location.reload(); };
      }, function (e) { send.disabled = false; send.textContent = 'Send to ' + b.knownAs + ' to approve'; document.getElementById('err').textContent = errText(e); });
    };
  }

  // ------------------------------------------------------------ crew and Captain approve
  function Review() {
    var b = BOOT, crew = b.who === 'crew';
    if (b.state === 'replaced') {
      return paint('<header class="page-head wrap">' + logo() + '<h1>This link is out of date</h1><p>A newer version of this profile has been sent, or it is not your turn yet. Use the button in the latest email.</p></header><main class="wrap">' + chars('small') + '</main>');
    }
    if (b.state === 'done') {
      return paint('<header class="page-head wrap">' + logo() + '<h1>' + (b.decision === 'Approved' ? 'Already approved' : 'Change already asked') + '</h1><p>' +
        (b.decision === 'Approved' ? 'You approved this profile on ' : 'You asked for a change on ') + esc(b.when) + '. Nothing more to do.</p></header><main class="wrap">' + profileCard() + '</main>');
    }
    paint('<header class="page-head wrap">' + logo() + '<h1>' + (crew ? 'Your crew profile' : 'Crew profile for ' + esc(b.name)) + '</h1><p>' +
      (crew ? 'The Purser has written this from your answers. Please read it, then approve it or ask for a change.' : esc(b.knownAs) + ' has approved this text. Once you approve it, it can go in the Welcome Book and the charter brochure.') + '</p></header>' +
      '<main class="wrap">' + (b.note ? '<div class="note"><b>Note from the Purser:</b><br>' + esc(b.note).replace(/\n/g, '<br>') + '</div>' : '') + profileCard() +
      '<div id="changeBox" style="display:none" class="card"><label for="comment"><b>What would you like changed?</b></label><textarea class="mid" id="comment"></textarea>' +
      '<div class="nav" style="margin:14px 0 0"><button class="btn ghost" id="cancel">Cancel</button><button class="btn primary" id="sendChange">Send to the Purser</button></div></div>' +
      '<div class="err" id="err" role="alert"></div>' +
      '<div class="nav" id="choices"><button class="btn ghost" id="change">Ask for a change</button><button class="btn gold" id="approve">Approve</button></div></main>');
    var finish = function (title, body) {
      paint('<header class="page-head wrap">' + logo() + '<h1 class="rise d1">' + title + '</h1><p class="rise d2">' + body + '</p></header><main class="wrap">' + crewRow('small jump') + '<p class="small centre" style="margin:18px 0 40px">You can close this page.</p></main>');
      bindCrew();
    };
    var fail = function (btn, label) { return function (e) { btn.disabled = false; btn.textContent = label; document.getElementById('err').textContent = errText(e); }; };
    var approve = document.getElementById('approve');
    approve.onclick = function () {
      approve.disabled = true; approve.innerHTML = '<span class="spin"></span>Approving';
      call('recordDecision', [b.ref, b.who, b.k, 'approve', ''], function () {
        finish('Approved, thank you', crew ? 'The profile now goes to the Captain for approval.' : 'The Purser has been told the profile is approved.');
        setTimeout(function () { confetti(130); }, 250);
      }, fail(approve, 'Approve'));
    };
    document.getElementById('change').onclick = function () {
      document.getElementById('changeBox').style.display = 'block'; document.getElementById('choices').style.display = 'none'; document.getElementById('comment').focus();
    };
    document.getElementById('cancel').onclick = function () {
      document.getElementById('changeBox').style.display = 'none'; document.getElementById('choices').style.display = 'flex';
    };
    var sc = document.getElementById('sendChange');
    sc.onclick = function () {
      var c = document.getElementById('comment').value.trim();
      if (!c) { document.getElementById('err').textContent = 'Say what you would like changed.'; return; }
      sc.disabled = true; sc.innerHTML = '<span class="spin"></span>Sending';
      call('recordDecision', [b.ref, b.who, b.k, 'change', c], function () {
        finish('Sent to the Purser', 'The Purser will make the change and send you a new version' + (crew ? '.' : ', which goes back to ' + esc(b.knownAs) + ' first.'));
      }, fail(sc, 'Send to the Purser'));
    };
    function profileCard() {
      return '<article class="profile"><p class="who">' + esc(b.knownAs || b.name) + '</p><p class="post">' + esc(b.post) + '</p><div class="text">' + esc(b.text) + '</div></article>';
    }
  }

  function ErrorPage() {
    paint('<header class="page-head wrap">' + logo() + '<h1>Something is not right</h1><p>' + esc(BOOT.message || 'This page could not be opened.') + '</p></header><main class="wrap">' + chars('small') + '</main>');
  }

  function start() {
    try {
      if (BOOT.mode === 'form') Form();
      else if (BOOT.mode === 'send') Send();
      else if (BOOT.mode === 'review') Review();
      else ErrorPage();
    } catch (e) {
      paint('<main class="wrap"><p class="err" style="margin:30px 0">The page could not start: ' + esc(e.message) + '</p></main>');
    }
  }
  if (API && !BOOT) {
    paint('<div class="loading">' + logo() + '<div class="lb">' + boatSvg() + '</div><div class="lw"><svg viewBox="0 0 1440 48" preserveAspectRatio="none"><path d="' + WAVE_A + '" fill="#BA9456" opacity=".45"/></svg></div><p>Loading</p></div>');
    var q = {};
    location.search.replace(/^\?/, '').split('&').forEach(function (kv) { if (!kv) return; var i = kv.indexOf('='); q[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); });
    var tryLoad = function (n) {
      var ownImg = Object.keys(IMG).length > 0;
      api('boot', [{ view: q.view || q.p || '', ref: q.ref || '', k: q.k || '', who: q.who || '', debug: q.debug || '', noimg: ownImg ? '1' : '' }]).then(function (d) {
        BOOT = d.boot; if (!ownImg) IMG = d.img || {}; window.BOOT = BOOT; DEBUG = !!BOOT.debug; start();
      }, function (e) {
        if (n > 0) return setTimeout(function () { tryLoad(n - 1); }, 1500);
        paint('<header class="page-head wrap" style="padding-top:60px">' + logo() + '<h1>The page could not load</h1><p>' + esc(e.message) + '</p></header>');
      });
    };
    tryLoad(1);
  } else start();
})();
</script>
</body></html>
